<!DOCTYPE html>
<html lang="th">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>หน้าแรก ✨ | My Portfolio</title>

<style>

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, Tahoma, sans-serif;
  background: linear-gradient(135deg, #dff6ff, #fff0f8);
  color: #666;
}


/* =========================
   แถบเมนู
========================= */

.navbar {
  position: fixed;
  top: 0;
  left: 0;

  width: 100%;
  height: 70px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 0 40px;

  background: rgba(255,255,255,0.95);

  box-shadow: 0 4px 18px rgba(120,180,220,0.2);

  z-index: 999;
}

.nav-logo {
  color: #e98faf;
  font-size: 20px;
  font-weight: bold;
  white-space: nowrap;
}

.nav-menu {
  display: flex;
  gap: 8px;
  list-style: none;
}

.nav-menu a {
  text-decoration: none;
  color: #69aeca;
  font-weight: bold;

  padding: 10px 14px;
  border-radius: 25px;

  transition: 0.3s;
}

.nav-menu a:hover {
  background: #ffe3ef;
  color: #e77fa5;
  transform: translateY(-3px);
}


/* =========================
   หน้าแรก
========================= */

.home {
  min-height: 100vh;

  padding: 110px 20px 60px;

  position: relative;
  overflow: hidden;

  display: flex;
  justify-content: center;
  align-items: center;

  text-align: center;

  background: linear-gradient(135deg, #dff6ff, #fff0f8);
}


/* =========================
   กล่องหลัก
========================= */

.home-content {
  position: relative;
  z-index: 2;

  background: rgba(255,255,255,0.88);

  padding: 40px 35px;

  border-radius: 35px;

  width: min(700px, 95%);

  box-shadow:
    0 15px 40px rgba(130,180,215,0.25);

  border: 3px solid white;

  animation: appear 0.8s ease;
}


/* =========================
   รูปโปรไฟล์กรอบดาว
========================= */

.profile-photo {
  width: 280px;
  height: 280px;

  margin: 0 auto 20px;

  overflow: hidden;

  clip-path: polygon(
    50% 100%,
    0 35%,
    0 22%,
    10% 8%,
    25% 3%,
    40% 8%,
    50% 22%,
    60% 8%,
    75% 3%,
    90% 8%,
    100% 22%,
    100% 35%
  );

  background: linear-gradient(
    135deg,
    #f5a5c5,
    #91d8f2
  );
}

.profile-photo img {
  width: 100%;
  height: 100%;

  object-fit: cover;
}


/* =========================
   ตกแต่ง
========================= */

.decor {
  position: absolute;

  top: 95px;

  color: #f3a9c8;

  font-size: 25px;
}

.bear {
  font-size: 65px;

  margin-bottom: 5px;

  animation: bounce 2s infinite;
}


/* =========================
   ข้อความ
========================= */

.welcome {
  color: #69aeca;

  font-weight: bold;

  letter-spacing: 2px;

  font-size: 14px;
}

h1 {
  color: #555;

  font-size: 38px;

  line-height: 1.5;

  margin: 15px 0;
}

h1 span {
  color: #ed8eb1;
}

.intro {
  color: #777;

  font-size: 20px;

  margin-bottom: 20px;
}

.cute-icons {
  font-size: 25px;

  letter-spacing: 8px;

  margin: 20px 0;
}


/* =========================
   ปุ่ม
========================= */

.start-btn {
  display: inline-block;

  text-decoration: none;

  background:
    linear-gradient(
      135deg,
      #f3a1c0,
      #83cbe8
    );

  color: white;

  padding: 13px 28px;

  border-radius: 30px;

  font-weight: bold;

  box-shadow:
    0 7px 18px rgba(150,190,220,0.25);

  transition: 0.3s;
}

.start-btn:hover {
  transform: scale(1.06);
}


/* =========================
   ของตกแต่งลอย
========================= */

.floating {
  position: absolute;

  font-size: 35px;

  animation:
    floating 4s ease-in-out infinite;
}

.f1 {
  left: 10%;
  top: 25%;
}

.f2 {
  right: 12%;
  top: 20%;
}

.f3 {
  left: 15%;
  bottom: 20%;
}

.f4 {
  right: 15%;
  bottom: 18%;
}


/* =========================
   Animation
========================= */

@keyframes floating {

  0%,100% {
    transform: translateY(0) rotate(0deg);
  }

  50% {
    transform: translateY(-20px) rotate(8deg);
  }

}

@keyframes bounce {

  0%,100% {
    transform: translateY(0);
  }

  50% {
    transform: translateY(-10px);
  }

}

@keyframes appear {

  from {
    opacity: 0;
    transform: translateY(35px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }

}


/* =========================
   มือถือ
========================= */

@media (max-width:700px) {

  .navbar {
    height: auto;

    padding: 10px;

    flex-direction: column;

    gap: 5px;
  }

  .nav-logo {
    font-size: 16px;
  }

  .nav-menu {
    gap: 2px;
  }

  .nav-menu a {
    font-size: 11px;

    padding: 7px;
  }

  .home {
    padding-top: 150px;
  }

  .home-content {
    padding: 30px 18px;
  }

  .profile-photo {
    width: 230px;
    height: 230px;
  }

  h1 {
    font-size: 28px;
  }

  .intro {
    font-size: 17px;
  }

}

</style>

</head>


<body>


<!-- =========================
     แถบเมนู
========================= -->

<nav class="navbar">

  <div class="nav-logo">
    🥥 My Portfolio
  </div>

  <div class="nav-menu">

    <a href="index.html">
      🏠 หน้าแรก
    </a>

    <a href="me.html">
      🌷 เกี่ยวกับฉัน
    </a>

    <a href="activities.html">

    </a>

    <a href="works.html">
      🏆 ผลงาน
    </a>

    <a href="contact.html">

    </a>

  </div>

</nav>


<!-- =========================
     หน้าแรก
========================= -->

<section class="home">


  <!-- ของตกแต่ง -->

  <div class="decor">
    ✦ 🥕 ✦ 🎀 ✦ 🍯 ✦
  </div>


  <div class="home-content">


    <!-- รูปโปรไฟล์กรอบหัวใจ -->

    <div class="profile-photo">

      <img src="IMG_3540.jpeg?v=2" 

  alt="รูปภาพ">
      

    </div>


    <div class="bear">
      🧸
    </div>


    <p class="welcome">
      ✨ WELCOME TO MY PORTFOLIO ✨
    </p>


    <h1>

      ยินดีต้อนรับสู่<br>

      <span>
        เว็บไซต์ Portfolio ของฉัน
      </span>

      💕

    </h1>


    <p class="intro">
      เรามาทำความรู้จักกันให้มากขึ้นกันเถอะ! 🌷
    </p>


    <div class="cute-icons">
      🫐 💙 📚 🔒
    </div>


    <!-- ปุ่มไปหน้าเกี่ยวกับฉัน -->

    <a
      href="me.html"

    >

      💌 ทำความรู้จักฉัน

    </a>


  </div>


  <!-- ของตกแต่งลอย -->

  <div class="floating f1">
    💗
  </div>

  <div class="floating f2">
    🌸
  </div>

  <div class="floating f3">
    🎀
  </div>

  <div class="floating f4">
    ✨
  </div>


</section>


</body>
</html>
